[tool.uv]
# 必须使用 uv 自己管理的 CPython：本机 Anaconda 的 Python 3.12 作为 venv 基础时，
# onnxruntime 等原生扩展开头导入即触发 0xC0000005 (access violation) 崩溃。
python-preference = "only-managed"
# 锁定 mistralai 到 1.x：mistralai 2.0 起包结构改为 mistralai.client.*，
# 不再有顶层 mistralai/__init__.py 和 mistralai.models，而
# llama_index.finetuning.mistralai 仍在用 `from mistralai import Mistral`
# 和 `from mistralai.models import ...` 这套 1.x API，
# 装 2.x/3.x 会让 `llama_index.experimental` 导入链直接报 ImportError。
constraint-dependencies = ["mistralai>=1,<2"]
# 强制 brotli >= 1.2.1：aiohttp 3.14 解压时调用 Decompressor.process(data, max_length)，
# 而 brotli 1.1.0 的 process() 只接受 1 个参数 -> TypeError 被 aiohttp 吞掉后
# 报成 "400, message: Can not decode content-encoding: br"，
# 导致 bilibili_api（aiohttp 客户端）拉取视频信息必然失败。
# bilibili-api-python 自己把 brotli 上限定在 <1.2，但 1.2.1 完全向下兼容
# （decompress() / process(data) 都保留），所以这里用 override 覆盖它的上界。
override-dependencies = ["brotli>=1.2.1"]

